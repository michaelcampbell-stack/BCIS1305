<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BCIS 1305 Midterm Review</title>
<meta name="description" content="Practice questions for the BCIS 1305 midterm with an explanation for every answer choice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#17212B; --muted:#5A6672; --rule:#D3DAE1; --soft:#E7EBEF;
  --action:#1F4E79; --action-ink:#FFFFFF;
  --ok:#2E7D4F; --ok-bg:#E5F2EA; --bad:#B3392F; --bad-bg:#F8E6E4;
  --warn-bg:#FBF0D9; --warn-ink:#7A4F00;
  --dW:#2B579A; --dP:#B8421F; --dG:#1F7A52;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#12181E; --surface:#1A222A; --ink:#E6EBF0; --muted:#9AA6B2; --rule:#2D3843; --soft:#222C36;
  --action:#6FA8DC; --action-ink:#0E1620;
  --ok:#6CC08F; --ok-bg:#183326; --bad:#EE7F74; --bad-bg:#3A1F1C;
  --warn-bg:#3A2E14; --warn-ink:#E5B65A;
  --dW:#7FA8E8; --dP:#F09270; --dG:#5EC29B;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12181E; --surface:#1A222A; --ink:#E6EBF0; --muted:#9AA6B2; --rule:#2D3843; --soft:#222C36;
  --action:#6FA8DC; --action-ink:#0E1620;
  --ok:#6CC08F; --ok-bg:#183326; --bad:#EE7F74; --bad-bg:#3A1F1C;
  --warn-bg:#3A2E14; --warn-ink:#E5B65A;
  --dW:#7FA8E8; --dP:#F09270; --dG:#5EC29B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--action);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:28px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.015em}
h2{font-size:19px;margin:36px 0 12px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:14px}
.save-state{font-size:13px;color:var(--muted);margin-top:36px}

.ribbon{display:flex;gap:4px;margin:18px 0 6px;min-height:92px}
.seg{position:relative;border:2px solid var(--c);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left;padding:10px 10px 8px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:background .15s,color .15s}
.seg[aria-pressed="true"]{background:var(--c);color:#fff}
:root[data-theme="dark"] .seg[aria-pressed="true"]{color:#0E1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg[aria-pressed="true"]{color:#0E1620}}
.seg .pct{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.seg .nm{font-size:14px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.seg .sub{font-size:12px;opacity:.9}
.ribbon-note{font-size:13px;color:var(--muted);margin-bottom:24px}
.field{margin:22px 0}
.field > .lbl{font-weight:600;margin-bottom:8px;display:block}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--action);background:var(--action);color:var(--action-ink)}
.chip.custom{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 14px}
.chip.custom input{width:64px;border:1px solid var(--rule);border-radius:999px;padding:3px 8px;background:var(--bg)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px}
.pool-note{font-size:13px;color:var(--muted);margin-top:6px}
.btn{border:0;background:var(--action);color:var(--action-ink);font-weight:600;padding:11px 22px;border-radius:9px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--action);border:1.5px solid var(--action)}
.btn.quiet{background:transparent;color:var(--muted);padding:11px 8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.drill-tag{display:inline-flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:14px;margin-top:4px}
.drill-tag button{border:0;background:none;color:var(--action);font-weight:600;padding:0}

.qhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.dtag{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.dtag::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.unv{background:var(--warn-bg);color:var(--warn-ink);font-weight:600;font-size:12px;padding:2px 9px;border-radius:999px}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:22px}
.progress > i{display:block;height:100%;background:var(--action);transition:width .2s}
.stem{font-family:var(--serif);font-size:20px;line-height:1.55;margin:0 0 22px;max-width:68ch;outline:none}
.opts{display:grid;gap:10px;margin-bottom:18px}
.ch{border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;overflow:hidden}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;width:100%;padding:12px 14px;line-height:1.45}
.opt .key{flex:none;width:26px;height:26px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px}
.ch.sel{border-color:var(--action);box-shadow:0 0 0 1px var(--action)}
.ch.sel .key{background:var(--action);color:var(--action-ink)}
.ch.correct{border-color:var(--ok);background:var(--ok-bg)}
.ch.correct .key{background:var(--ok);color:#fff}
.ch.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ch.wrong .key{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:inherit}
.why{padding:0 14px 13px 52px;font-size:14.5px;line-height:1.5}
.why .tag{display:block;font-weight:700;font-size:13px;margin-bottom:1px}
.ch.correct .tag{color:var(--ok)} .ch.wrong .tag{color:var(--bad)}
.verdict{border-left:4px solid var(--c);background:var(--surface);border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:14px}
.unvnote{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.kbd-hint{font-size:12px;color:var(--muted);margin-top:14px}
.confirm{margin-top:14px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px}
.stat b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.hero-score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero-score .big{font-size:64px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dom-rows{display:grid;gap:14px}
.dom-row .top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px;flex-wrap:wrap}
.bar{position:relative;height:12px;background:var(--soft);border-radius:6px;overflow:visible}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--c)}
.bar .target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--soft);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-weak{background:var(--bad-bg);color:var(--bad)} .s-dev{background:var(--warn-bg);color:var(--warn-ink)}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-none{background:var(--soft);color:var(--muted)}
.plan{counter-reset:p;display:grid;gap:12px;padding:0;margin:0;list-style:none}
.plan li{counter-increment:p;display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px}
.plan li::before{content:counter(p);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.review-item{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:12px}
.review-item .q{font-family:var(--serif);margin-bottom:8px}
.review-item .ans{font-size:14px;margin-bottom:4px}
.empty{background:var(--surface);border:1px dashed var(--rule);border-radius:12px;padding:28px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;background:var(--c)}
.danger{color:var(--bad)}
.xall{margin-top:10px}
.xall > summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--action);padding:4px 0}
.xall .opts{margin:10px 0 0}
.gotit{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:8px;cursor:pointer;font-size:14px;line-height:1.4}
.gotit input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ok);cursor:pointer}
.gotit .gotit-note{color:var(--muted)}
.gotit.done{background:var(--ok-bg)}
.miss-card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin:18px 0 26px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.miss-card .n{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--bad)}
.miss-meta{font-size:13px;color:var(--muted);margin-bottom:6px}
details.mastered{margin-top:34px}
details.mastered summary{cursor:pointer;font-weight:600}
.mastered-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.linkbtn{border:0;background:none;color:var(--action);font-weight:600;padding:0;font-size:14px}
@media (max-width:620px){
  .ribbon{flex-direction:column;min-height:0}
  .seg{flex:none !important;flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
  .seg .pct{font-size:20px;width:52px}
  .seg > span:last-child{flex:1;text-align:left}
  .stem{font-size:18px}
  .hero-score .big{font-size:48px}
  .plan li{grid-template-columns:28px 1fr}
  .plan li .act{grid-column:2}
  .why{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

  </header>
