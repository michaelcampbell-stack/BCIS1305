/* ---------- progress ---------- */
function trendChart(att){
  const W = 820, H = 240, pad = {l:40, r:12, t:12, b:28};
  if (att.length < 10) return `<div class="empty">Answer at least 10 questions to see your accuracy trend.</div>`;
  const win = Math.min(25, Math.max(5, Math.floor(att.length/4)));
  const pts = []; let r = 0;
  att.forEach((a,i) => { r += a.ok?1:0; if (i >= win) r -= att[i-win].ok?1:0; if (i >= win-1) pts.push([i+1, 100*r/win]); });
  const step = Math.max(1, Math.floor(pts.length/300));
  const P = pts.filter((_,i) => i % step === 0 || i === pts.length-1);
  const x = v => pad.l + (W-pad.l-pad.r) * (v-1) / Math.max(1, att.length-1);
  const y = v => pad.t + (H-pad.t-pad.b) * (1 - v/100);
  const path = P.map((p,i) => (i?"L":"M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
  const grid = [0,25,50,75,100].map(g => `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--soft)"/><text x="${pad.l-8}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${g}%</text>`).join("");
  let c = 0; const C = att.map((a,i) => { c += a.ok?1:0; return [i+1, 100*c/(i+1)]; }).filter((_,i,arr) => i % Math.max(1,Math.floor(arr.length/300)) === 0 || i === arr.length-1);
  const cpath = C.map((p,i) => (i?"L":"M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accuracy over time: rolling ${win} question accuracy and overall accuracy">
    ${grid}<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(TARGET)}" y2="${y(TARGET)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".5"/>
    <path d="${cpath}" fill="none" stroke="var(--muted)" stroke-width="2"/><path d="${path}" fill="none" stroke="var(--action)" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="${pad.l}" y="${H-8}" font-size="11" fill="var(--muted)">Question 1</text><text x="${W-pad.r}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">Question ${att.length}</text></svg>
    <div class="legend"><span><i style="--c:var(--action)"></i>Rolling accuracy, last ${win} answers</span><span><i style="--c:var(--muted)"></i>Overall accuracy</span><span><i style="--c:var(--ink);opacity:.5"></i>${TARGET}% target</span></div>`;
}
function renderProgress(){
  const st = computeStats(), att = st.att;
  if (!att.length) {
    $app.innerHTML = `<h1>Progress</h1><div class="empty"><h3>No answers yet</h3><p class="muted">Finish a practice set and this page will show your accuracy by topic, track your trend over time, and suggest where to focus.</p><button class="btn" id="go1">Start practicing</button></div>`;
    $app.querySelector("#go1").onclick = () => go("setup"); return;
  }
  const ok = att.filter(a => a.ok).length, seen = Object.keys(st.perQ).length;
  const avgS = Math.round(att.reduce((x,a) => x + (a.ms||0), 0)/att.length/1000);
  const sessList = Object.values(sessions).filter(s => (s.attempts||[]).length).sort((a,b) => b.startedAt - a.startedAt);
  const half = list => { if (list.length < 20) return null; const h = Math.floor(list.length/2); const a = list.slice(0,h), b = list.slice(h); return Math.round(100*b.reduce((x,y)=>x+y,0)/b.length - 100*a.reduce((x,y)=>x+y,0)/a.length); };
  const below = GORDER.filter(d => st.byD[d].n >= 10 && st.recent(st.byD[d].list, 40) < TARGET);
  const untouched = GORDER.filter(d => st.byD[d].n === 0);
  const notes = [];
  if (!st.enough) notes.push(`Your readiness estimate is still rough. Aim for at least 10 answers in every topic${untouched.length ? `; you have not started ${untouched.map(d => GR[d].name).join(" or ")}` : ""}.`);
  if (below.length) notes.push(`Recent accuracy is below ${TARGET}% in ${below.map(d => `${GR[d].name} (${st.recent(st.byD[d].list,40)}%)`).join(", ")}.`);
  if (st.repeat.length) notes.push(`${st.repeat.length} question${st.repeat.length>1?"s have":" has"} been missed two or more times. They are listed below and are worth reviewing until the reasoning feels automatic.`);
  if (seen < QS.length) notes.push(`You have seen ${seen} of the ${QS.length} questions. The real midterm draws from this same pool, so aim to see them all.`);
  const focus = GORDER.map(d => { const g = st.byD[d]; const r = st.recent(g.list, 40); return {d, g, r, pri: g.n ? (100 - r) * GCOUNT[d] : 50 * GCOUNT[d]}; }).sort((a,b) => b.pri - a.pri);
  $app.innerHTML = `
    <h1>Progress</h1>
    <div class="hero-score" style="margin-top:14px"><span class="big">${st.readiness === null ? "n/a" : st.readiness + "%"}</span>
      <span class="muted">Readiness, based on your last 40 answers in each topic and weighted by topic size.<br>This app uses ${TARGET}% as a study target.</span></div>
    <div class="stats">
      <div class="stat"><b>${att.length.toLocaleString()}</b><span>answers</span></div>
      <div class="stat"><b>${pct(ok, att.length)}%</b><span>correct overall</span></div>
      <div class="stat"><b>${seen}</b><span>of ${QS.length} questions seen</span></div>
      <div class="stat"><b>${st.missedNow.length}</b><span>on your missed list</span></div>
      <div class="stat"><b>${avgS}s</b><span>average per question</span></div>
    </div>
    ${notes.length ? `<div class="card"><h3>What the numbers say</h3>${notes.map(n => `<p class="small" style="margin:6px 0">${esc(n)}</p>`).join("")}</div>` : ""}
    <h2>Where to focus</h2>
    <p class="muted small">Topics ranked by how much they are likely to cost you: how often you miss them, weighted by how many questions they hold. A topic you have not tried counts as a risk.</p>
    <ol class="plan">${focus.map(f => `<li><div><strong>${GR[f.d].name}</strong><div class="small muted">${f.g.n ? `${pct(f.g.ok, f.g.n)}% across ${f.g.n} answers, recent ${f.r}%` : "Not attempted yet"}. ${st.seenD[f.d]} of ${GCOUNT[f.d]} questions seen.</div></div>
      <div class="act"><button class="btn ghost" data-drill="${f.d}" style="padding:7px 14px;font-size:14px">Practice ${GR[f.d].name}</button></div></li>`).join("")}</ol>
    <h2>Accuracy over time</h2><div class="card">${trendChart(att)}</div>
    <h2>By topic</h2>
    <div class="dom-rows">${GORDER.map(d => { const g = st.byD[d]; const r = st.recent(g.list, 40); const ch = half(g.list); const [lab, cls] = statusOf(g.n, r);
      return `<div class="dom-row" style="${cvar(d)}"><div class="top"><span class="dtag" style="${cvar(d)}">${GR[d].name} <span class="muted" style="font-weight:400">${GCOUNT[d]} questions</span></span>
        <span>${g.n ? `${pct(g.ok,g.n)}% overall, recent ${r}%${ch !== null ? `, ${ch >= 0 ? "up" : "down"} ${Math.abs(ch)} pts vs earlier` : ""}` : "Not started"} <span class="status ${cls}">${lab}</span></span></div>
        <div class="bar"><i style="width:${r||0}%"></i><span class="target" style="left:${TARGET}%"></span></div>
        <div class="small muted" style="margin-top:4px">${st.seenD[d]} of ${GCOUNT[d]} questions seen, ${g.n} answers</div></div>`; }).join("")}</div>
    <h2>Repeatedly missed</h2>
    ${st.repeat.length ? `<div class="tablewrap"><table><thead><tr><th>Question</th><th>Topic</th><th class="num">Missed</th></tr></thead><tbody>${st.repeat.sort((a,b) => b.miss - a.miss).slice(0,25).map(r => { const q = QBYID[r.id]; return `<tr><td>${esc(q.q.length > 110 ? q.q.slice(0,107)+"..." : q.q)}</td><td>${GR[q.d].name}</td><td class="num">${r.miss} of ${r.n}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted">No question has been missed more than once.</p>`}
    <h2>Session history</h2>
    <div class="tablewrap"><table><thead><tr><th>Date</th><th>Topics</th><th class="num">Questions</th><th class="num">Score</th><th>Explanations</th></tr></thead><tbody>
      ${sessList.slice(0,60).map(s => { const a = s.attempts, o = a.filter(x => x.ok).length; return `<tr><td>${new Date(s.startedAt).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}</td>
        <td>${s.settings.pool === "retry" ? "Retry of misses" : s.settings.groups.length === 3 ? "All three" : s.settings.groups.map(d => GR[d].name).join(", ")}</td>
        <td class="num">${a.length}</td><td class="num">${pct(o, a.length)}%</td><td>${s.settings.feedback === "end" ? "End of set" : "Each question"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <h2>Your data</h2>
    <p class="muted small">Your history lives only in this browser on this device. Export it if you want a copy.</p>
    <div class="row"><button class="btn ghost" id="exportBtn">Export history</button><button class="btn quiet danger" id="resetBtn">Erase all history</button></div>`;
  $app.querySelectorAll("[data-drill]").forEach(b => b.onclick = () => { settings.groups = [b.dataset.drill]; settings.count = Math.min(15, GCOUNT[b.dataset.drill]); settings.pool = "unseen"; saveSettings(); go("setup"); });
  $app.querySelector("#exportBtn").onclick = exportData;
  const rb = $app.querySelector("#resetBtn");
  rb.onclick = () => { if (!rb.dataset.sure) { rb.dataset.sure = "1"; rb.textContent = "Tap again to erase everything"; return; } sessions = {}; missbook = {mastered:{}}; lsSet(LS_KEY, sessions); lsSet(LS_MB, missbook); render(); };
}
function exportData(){
  const st = computeStats();
  const rows = [["date","question_number","topic","correct","seconds","question","your_answer","correct_answer"]];
  st.att.forEach(a => { const q = QBYID[a.q]; rows.push([new Date(a.at).toISOString(), q.id, GR[q.d].name, a.ok ? "yes" : "no", Math.round((a.ms||0)/1000), q.q, q.o[a.c], q.o[q.c]]); });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  const a = document.createElement("a"); a.href = url; a.download = "bcis1305-review-history.csv"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- missed ---------- */
let missedFilter = "all";
const fmtDate = ts => new Date(ts).toLocaleDateString([], {month:"short", day:"numeric"});
function renderMissed(){
  const st = computeStats();
  const ids = st.missedNow.filter(id => missedFilter === "all" || QBYID[id].d === missedFilter)
    .sort((x,y) => st.missInfo[y].misses - st.missInfo[x].misses || st.missInfo[y].lastWrong.at - st.missInfo[x].lastWrong.at);
  const groups = missedFilter === "all" ? ["W","P","G"] : [missedFilter];
  const card = id => {
    const q = QBYID[id], m = st.missInfo[id], a = m.lastWrong;
    const lastTxt = m.last.ok ? `answered correctly on ${fmtDate(m.last.at)}` : `missed on ${fmtDate(m.last.at)}`;
    return `<div class="review-item" style="${cvar(q.d)}">
      <div class="miss-meta">${GR[q.d].name}. Missed ${m.misses} of ${m.tries} tr${m.tries===1?"y":"ies"}; most recently ${lastTxt}. Correct in a row since last miss: ${m.streak} of ${STREAK}.${q.u ? ' <span class="unv">Answer unverified</span>' : ""}</div>
      <div class="q">${esc(q.q)}</div>
      <div class="ans" style="color:var(--bad)"><strong>Your last wrong answer:</strong> ${esc(q.o[a.c])}</div>
      <div class="ans" style="color:var(--ok)"><strong>Correct answer:</strong> ${esc(q.o[q.c])}</div>
      ${xallHTML(q, a.c)}${gotItHTML(id, st)}</div>`;
  };
  const mast = st.mastered.sort((x,y) => st.missInfo[y].gotItAt - st.missInfo[x].gotItAt);
  $app.innerHTML = `
    <h1>Missed questions</h1>
    <p class="muted">Every question you have missed stays here, even after you answer it correctly. It leaves when you check <strong>I've got it</strong> or when you answer it correctly 3 times in a row. If you miss it again later, it comes back.</p>
    <div class="row" style="margin:18px 0 8px"><div class="choices">
      <button class="chip" data-mf="all" aria-pressed="${missedFilter==="all"}">All (${st.missedNow.length})</button>
      ${GORDER.map(d => `<button class="chip" data-mf="${d}" aria-pressed="${missedFilter===d}">${GR[d].name} (${st.missedNow.filter(id => QBYID[id].d===d).length})</button>`).join("")}
    </div></div>
    ${ids.length ? `<div class="miss-card"><span class="n">${ids.length}</span>
      <div style="flex:1;min-width:220px"><strong>Quiz on ${missedFilter === "all" ? "your missed list" : GR[missedFilter].name + " misses"}</strong>
        <div class="row small" style="margin-top:8px;gap:8px"><span class="muted">Questions:</span>
          ${[5,10,25].filter(n => n < ids.length).map(n => `<button class="chip" data-mc="${n}" aria-pressed="${settings.count===n}">${n}</button>`).join("")}
          <button class="chip" data-mc="${ids.length}" aria-pressed="${settings.count>=ids.length || ![5,10,25].includes(settings.count)}">All ${ids.length}</button></div>
        <div class="row small" style="margin-top:8px;gap:8px"><span class="muted">Explanations:</span>
          <button class="chip" data-mfb="instant" aria-pressed="${settings.feedback==="instant"}">After each question</button>
          <button class="chip" data-mfb="end" aria-pressed="${settings.feedback==="end"}">At the end</button></div></div>
      <button class="btn" id="practiceMissed">Quiz me on missed questions only</button></div>` : ""}
    ${ids.length ? ids.map(card).join("") : `<div class="empty">${st.att.length ? (st.mastered.length ? "Your missed list is empty. Everything you have missed is marked \"I've got it.\"" : "No misses yet.") : "Missed questions will collect here once you start practicing."}</div>`}
    ${mast.length ? `<details class="mastered"><summary>Cleared from the list (${mast.length})</summary>
      ${mast.map(id => { const q = QBYID[id]; return `<div class="mastered-row"><span>${esc(q.q.length > 120 ? q.q.slice(0,117)+"..." : q.q)} <span class="muted">(missed ${st.missInfo[id].misses}x, ${st.missInfo[id].how === "streak" ? "cleared by 3 in a row" : "marked"} ${fmtDate(st.missInfo[id].gotItAt)})</span></span><button class="linkbtn" data-putback="${id}">Put back</button></div>`; }).join("")}</details>` : ""}`;
  $app.querySelectorAll("[data-mf]").forEach(b => b.onclick = () => { missedFilter = b.dataset.mf; renderMissed(); });
  $app.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => { settings.count = +b.dataset.mc; saveSettings(); renderMissed(); });
  $app.querySelectorAll("[data-mfb]").forEach(b => b.onclick = () => { settings.feedback = b.dataset.mfb; saveSettings(); renderMissed(); });
  $app.querySelectorAll("[data-putback]").forEach(b => b.onclick = () => { setGotIt(b.dataset.putback, false); renderMissed(); });
  const pm = $app.querySelector("#practiceMissed"); if (pm) pm.onclick = () => startMissedQuiz(groups);
}

render();
})();
</script>
</body>
</html>
